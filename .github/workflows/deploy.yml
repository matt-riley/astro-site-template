name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    permissions:
      contents: read
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@0a310f1286537ed4fd000af4b35cd6459b00448d # v4
    with:
      install: true
      build: true
      artifact-name: pages-site
      artifact-path: dist

  deploy:
    needs: build
    permissions:
      contents: read
    uses: matt-riley/matt-riley-ci/.github/workflows/cloudflare-pages-deploy.yml@0a310f1286537ed4fd000af4b35cd6459b00448d # v4
    with:
      project-name: mysite
      artifact-name: pages-site
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
