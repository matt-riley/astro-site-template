name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: matt-riley/matt-riley-ci/.github/workflows/cloudflare-pages-deploy.yml@071c2c2bbe410f73126d3cefd0a0b6812b3565f6 # main
    with:
      project-name: mysite
      package-manager: pnpm
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
