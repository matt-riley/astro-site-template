name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    permissions:
      contents: read
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@b65e4f9b6883ebb8735e5f5e61f46d226024b76d # v4
    with:
      install: true
      build: true
      artifact-name: pages-site
      artifact-path: dist

  deploy:
    needs: build
    permissions:
      contents: read
    uses: matt-riley/matt-riley-ci/.github/workflows/cloudflare-pages-deploy.yml@b65e4f9b6883ebb8735e5f5e61f46d226024b76d # v4
    with:
      project-name: mysite
      artifact-name: pages-site
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
