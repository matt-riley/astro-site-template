name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:ci
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@8526bf82dbe51e5c0f5db5a2fe7ad09b03a60107 # v4
    with:
      install: true
      lint: true
      test: true
      build: true
